[package]
name = "sonus-server"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "The Sonus music server: a gateway in front of Navidrome (frozen at 0.64.2) that takes over its parts one by one"
license = "AGPL-3.0-only"
repository = "https://github.com/CreeperUX/Sonus"
publish = false

[dependencies]
aes-gcm = "0.11.1"
base64 = "0.23.1"
bytes = "1"
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std"] }
# gzip for the library's answers, as Navidrome compresses its own (pure Rust: miniz_oxide)
flate2 = "1"
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
getrandom = "0.4.3"
hmac = "0.13.0"
http-body-util = "0.1"
hyper = { version = "1", features = ["client", "server", "http1", "http2"] }
hyper-util = { version = "0.1", features = ["client-legacy", "server-auto", "server-graceful", "http1", "http2", "tokio"] }
ipnet = "2"
md-5 = "0.11.0"
png = "0.18.1"
qrcode = { version = "0.15.0", default-features = false }
# Unicode classes and ASCII word boundaries for the search syntax, as Go's regexp has them (library/search.rs)
regex = "1"
rusqlite = { version = "0.40.2", features = ["bundled", "collation"] }
serde_json = "1.0.154"
sha1 = "0.11.0"
sha2 = "0.11.0"
subtle = "2.6.1"
tokio-tungstenite = { version = "0.30", default-features = false }
tokio = { version = "1", features = ["fs", "io-util", "macros", "net", "process", "rt-multi-thread", "signal", "sync", "time"] }
toml = { version = "1", default-features = false, features = ["std", "parse", "serde"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }

[dev-dependencies]
# the tests' WebSocket client (the server itself needs neither the client nor the handshake)
tokio-tungstenite = { version = "0.30", default-features = false, features = ["connect", "handshake"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[profile.release]
lto = "thin"
strip = true
