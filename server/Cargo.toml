[package]
name = "sonus-server"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "The Sonus music server: a gateway in front of Navidrome (frozen at 0.64.2) that takes over its parts one by one"
license = "AGPL-3.0-only"
repository = "https://github.com/CreeperUX/Sonus"
publish = false

[dependencies]
aes-gcm = "0.11.1"
base64 = "0.23.1"
bytes = "1"
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std"] }
getrandom = "0.4.3"
http-body-util = "0.1"
hyper = { version = "1", features = ["client", "server", "http1", "http2"] }
hyper-util = { version = "0.1", features = ["client-legacy", "server-auto", "server-graceful", "http1", "http2", "tokio"] }
ipnet = "2"
md-5 = "0.11.0"
rusqlite = { version = "0.40.2", features = ["bundled"] }
serde_json = "1.0.154"
sha2 = "0.11.0"
subtle = "2.6.1"
tokio = { version = "1", features = ["io-util", "macros", "net", "process", "rt-multi-thread", "signal", "sync", "time"] }
toml = { version = "1", default-features = false, features = ["std", "parse", "serde"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[profile.release]
lto = "thin"
strip = true
